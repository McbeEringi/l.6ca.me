<script type="build">
import{join}from'node:path';
import links from'./redirects.mjs';
import tmpl from'html_tmpl';
import cfg from'config_default';

await Bun.write(
	join(import.meta.dir,'_redirects'),
	[
		'/favicon.ico /img/favicon.png 301',
		...links.map(({name,src,dst,code})=>`${src}#${name.replace(/\s/g,'_')} ${dst} ${code}`)
	].join('\n')
);

export default x=>(
	x=tmpl(cfg)(x),
	x.html=new HTMLRewriter()
	.on('div#links',{element:e=>e.append(
		links.map(x=>`<a href="${x.src??''}" data-dst="${x.dst??''}" ${x.attr??''}style="--img:url(${x.icon??''});"><p>${x.name??''}</p></a>`).join('\n'),
		{html:1}
	)})
	.transform(x.html),
	x
);
</script>

<main>
<h1>l.6ca.me</h1>
<p>McbeEringi Link Portal</p>
<a href="./redirects.mjs">redirects.mjs</a>
<hr>
<div class="zab">
	<div class="stuff" id="links"></div>
</div>
</main>
